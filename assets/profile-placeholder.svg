<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" aria-label="Profile Avatar Placeholder" role="img">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Subtle Glow Gradient -->
    <radialGradient id="avatarGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Silhouette Gradient -->
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Clothing Gradient -->
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Badge Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Circular Base Background -->
  <rect width="400" height="400" rx="200" fill="url(#bgGradient)" />
  <circle cx="200" cy="180" r="170" fill="url(#avatarGlow)" />

  <!-- Abstract Tech Grid Lines (Subtle decorative developer theme) -->
  <g stroke="#ffffff" stroke-opacity="0.1" stroke-width="2">
    <line x1="60" y1="200" x2="340" y2="200" />
    <line x1="200" y1="60" x2="200" y2="340" />
    <circle cx="200" cy="200" r="120" fill="none" stroke-dasharray="6,6" />
  </g>

  <!-- Developer Silhouette -->
  <!-- Shoulders / Torso -->
  <path d="M 90 385 C 90 300 135 270 200 270 C 265 270 310 300 310 385 Z" fill="url(#coatGrad)" />

  <!-- Collar / Inner Shirt -->
  <polygon points="200,270 175,320 225,320" fill="#e2e8f0" />
  <polygon points="200,285 185,320 215,320" fill="#0284c7" />

  <!-- Neck -->
  <rect x="180" y="210" width="40" height="65" rx="10" fill="url(#silhouetteGrad)" />

  <!-- Head -->
  <ellipse cx="200" cy="170" rx="55" ry="65" fill="url(#silhouetteGrad)" />

  <!-- Hair / Silhouette Style -->
  <path d="M 145 160 C 145 105 165 95 200 95 C 235 95 255 105 255 160 C 255 130 240 115 200 115 C 160 115 145 130 145 160 Z" fill="#0f172a" />

  <!-- Modern Glasses (representing developer focus) -->
  <g stroke="#0f172a" stroke-width="4" fill="none">
    <!-- Left lens -->
    <rect x="160" y="155" width="32" height="24" rx="6" fill="#ffffff" fill-opacity="0.25" stroke="#1e293b" />
    <!-- Right lens -->
    <rect x="208" y="155" width="32" height="24" rx="6" fill="#ffffff" fill-opacity="0.25" stroke="#1e293b" />
    <!-- Bridge -->
    <line x1="192" y1="165" x2="208" y2="165" stroke="#1e293b" />
    <!-- Temples -->
    <line x1="150" y1="163" x2="160" y2="165" stroke="#1e293b" />
    <line x1="240" y1="165" x2="250" y2="163" stroke="#1e293b" />
  </g>

  <!-- Code Bracket Badge (bottom right) -->
  <g filter="url(#dropShadow)">
    <circle cx="310" cy="310" r="42" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
    <!-- Code symbol < / > -->
    <path d="M 292 310 L 299 303 M 292 310 L 299 317" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 328 310 L 321 303 M 328 310 L 321 317" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="313" y1="300" x2="307" y2="320" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Outer Ring Border -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="#60a5fa" stroke-width="6" stroke-opacity="0.5" />
</svg>
